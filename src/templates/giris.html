{% extends "base.html" %}
{% block title %}Giriş Yap{% endblock %}

{% block content %}
<div class="jkb-auth-wrap d-flex align-items-center justify-content-center px-3">
  <div class="jkb-auth-card jkb-card w-100">

    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="JKB" height="52" class="mb-3" style="border-radius:12px">
      <h2 class="fw-bold text-white mb-1">Giriş Yap</h2>
      <p class="text-muted small">Hesabına giriş yap ve devam et.</p>
    </div>

    {% if hata %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span>{{ hata }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/giris" novalidate>
      <div class="mb-3">
        <label class="form-label text-muted small" for="kullanici_adi">Kullanıcı Adı</label>
        <div class="input-group">
          <span class="input-group-text jkb-input-icon"><i class="bi bi-person"></i></span>
          <input
            type="text"
            class="form-control"
            id="kullanici_adi"
            name="kullanici_adi"
            placeholder="kullanici_adi"
            autocomplete="username"
            required
            autofocus
          />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-muted small" for="sifre">Şifre</label>
        <div class="input-group">
          <span class="input-group-text jkb-input-icon"><i class="bi bi-lock"></i></span>
          <input
            type="password"
            class="form-control"
            id="sifre"
            name="sifre"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Giriş Yap
      </button>
    </form>

    <hr class="my-4 border-secondary" />

    <p class="text-center text-muted small mb-0">
      Hesabın yok mu?
      <a href="/kayit" class="jkb-link">Kayıt Ol</a>
    </p>
  </div>
</div>
{% endblock %}
