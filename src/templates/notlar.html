{% extends "base.html" %}
{% block title %}Notlar{% endblock %}

{% block content %}
<div class="container py-4 pt-hero">
  <h4 class="text-white mb-3"><i class="bi bi-journal-text me-2"></i>Notlarım</h4>

  <div class="jkb-card p-0" style="overflow:hidden">
    <form method="POST" action="/notlar">
      <textarea name="metin" class="form-control border-0 rounded-0"
                style="min-height:60vh;background:transparent;resize:vertical;font-size:15px;line-height:1.7"
                placeholder="Notlarını buraya yaz...">{{ metin }}</textarea>
      <div class="d-flex justify-content-end p-3" style="border-top:1px solid rgba(255,255,255,0.07)">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-floppy me-1"></i>Kaydet
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
