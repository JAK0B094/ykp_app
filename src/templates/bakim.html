<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakım — JKB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body {
      background: #0a0a14;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .bakim-icon {
      font-size: 64px;
      color: #f59e0b;
      margin-bottom: 24px;
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bakim-title { font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .bakim-sub { font-size: 15px; color: #94a3b8; max-width: 400px; line-height: 1.7; }
    .bakim-card {
      background: #16162a;
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
    }
    .bakim-badge {
      display: inline-block;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.25);
      color: #fde68a;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .bakim-duyuru {
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #a5b4fc;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="bakim-card">
    <div class="bakim-icon"><i class="bi bi-gear-wide-connected"></i></div>
    <div class="bakim-badge">⚙ Bakım</div>
    <div class="bakim-title">Bakım Modunda</div>
    <p class="bakim-sub">JKB şu anda bakım çalışması nedeniyle geçici olarak kullanılamıyor.<br>Kısa süre sonra tekrar erişilebilir olacak.</p>
    {% if duyuru %}
    <div class="bakim-duyuru"><i class="bi bi-megaphone me-2"></i>{{ duyuru }}</div>
    {% endif %}
  </div>
</body>
</html>
