<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Yönetici Girişi</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --adm-bg: #0a0a14;
      --adm-surface: #111120;
      --adm-card: #16162a;
      --adm-border: rgba(99,102,241,0.2);
      --adm-accent: #6366f1;
      --adm-accent2: #8b5cf6;
      --adm-text: #e2e8f0;
      --adm-muted: #94a3b8;
      --adm-danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--adm-bg);
      color: var(--adm-text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.08) 0%, transparent 60%);
    }
    .adm-card {
      background: var(--adm-card);
      border: 1px solid var(--adm-border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .adm-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .adm-title {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }
    .adm-sub {
      font-size: 13px;
      color: var(--adm-muted);
      margin-bottom: 32px;
    }
    .adm-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--adm-border);
      color: var(--adm-text);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      width: 100%;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .adm-input:focus {
      border-color: var(--adm-accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.18);
      background: rgba(255,255,255,0.06);
      color: #fff;
    }
    .adm-input::placeholder { color: var(--adm-muted); }
    .adm-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--adm-accent), var(--adm-accent2));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      letter-spacing: .3px;
    }
    .adm-btn:hover { opacity: .92; transform: translateY(-1px); }
    .adm-btn:active { transform: translateY(0); }
    .adm-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .adm-lock {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.2));
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .adm-back {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--adm-muted);
      text-decoration: none;
    }
    .adm-back:hover { color: var(--adm-text); }
  </style>
</head>
<body>
  <div class="adm-card">
    <div class="adm-lock"><i class="bi bi-shield-lock-fill text-indigo-400" style="color:#a5b4fc"></i></div>
    <div class="adm-badge"><i class="bi bi-cpu"></i> Kontrol Merkezi</div>
    <div class="adm-title">Yönetici Girişi</div>
    <div class="adm-sub">Bu alan sadece yetkili kişilere açıktır.</div>

    {% if hata %}
    <div class="adm-error"><i class="bi bi-exclamation-triangle me-2"></i>{{ hata }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label small text-secondary mb-1">Yönetici Şifresi</label>
        <input type="password" name="sifre" class="adm-input"
               placeholder="••••••••••••" autocomplete="current-password" autofocus required />
      </div>
      <button type="submit" class="adm-btn">
        <i class="bi bi-shield-check me-2"></i>Giriş Yap
      </button>
    </form>

    <a href="/" class="adm-back"><i class="bi bi-arrow-left me-1"></i>Ana sayfaya dön</a>
  </div>
</body>
</html>
