<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Moderatör Girişi — JKB</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body style="background:#0a0a14;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="width:100%;max-width:400px;padding:20px">
    <div class="adm-section text-center">
      <div class="adm-brand-icon mx-auto mb-3" style="width:52px;height:52px;font-size:22px;background:linear-gradient(135deg,#f59e0b,#d97706)">
        <i class="bi bi-shield-check"></i>
      </div>
      <div class="mb-1" style="font-size:11px;color:#f59e0b;font-weight:700;letter-spacing:1px">MODERATÖR PANELİ</div>
      <h4 class="fw-bold text-white mb-1">Moderatör Girişi</h4>
      <p class="text-secondary small mb-4">Normal kullanıcı hesabınla giriş yapmalısın — hesabında moderatör yetkisi olmalı.</p>

      {% if hata %}
      <div class="alert alert-danger small py-2 mb-3">{{ hata }}</div>
      {% endif %}

      <form method="POST">
        <button type="submit" class="adm-btn-action w-100" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;justify-content:center">
          <i class="bi bi-shield-fill-check me-2"></i>Giriş Yap
        </button>
      </form>

      <div class="mt-3">
        <a href="/" class="text-secondary small"><i class="bi bi-arrow-left me-1"></i>Ana sayfaya dön</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
