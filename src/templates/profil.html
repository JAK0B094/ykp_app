{% extends "base.html" %}
{% block title %}Profil{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:480px">
  <h4 class="text-white mb-4">Profilim</h4>

  <div class="card bg-dark border-secondary text-white p-3 mb-4">
    <div class="mb-2"><span class="text-muted">Kullanıcı Adı:</span> <strong>{{ kullanici }}</strong></div>
    <div class="mb-2"><span class="text-muted">E-Posta:</span> {{ eposta or "—" }}</div>
  </div>

  <h6 class="text-muted mb-2">Şifre Değiştir</h6>
  <form method="POST" action="/profil/sifre">
    {% if hata %}
    <div class="alert alert-danger small py-2">{{ hata }}</div>
    {% endif %}
    {% if basari %}
    <div class="alert alert-success small py-2">{{ basari }}</div>
    {% endif %}
    <div class="mb-2">
      <input type="password" name="eski_sifre" class="form-control" placeholder="Mevcut şifre" required>
    </div>
    <div class="mb-2">
      <input type="password" name="yeni_sifre" class="form-control" placeholder="Yeni şifre (6-32 karakter)" required>
    </div>
    <div class="mb-3">
      <input type="password" name="yeni_sifre2" class="form-control" placeholder="Yeni şifre tekrar" required>
    </div>
    <button type="submit" class="btn btn-outline-light">Şifreyi Güncelle</button>
  </form>
</div>
{% endblock %}
